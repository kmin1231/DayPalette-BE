name: "⚙️ CI/CD Pipeline: Docker → ECR → EC2"

on:
  #push:
  #  branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: daypalette-spring
  CONTAINER_NAME: daypalette-spring-server
  SPRING_SERVER_PORT: 8090
  ENV_PATH: /home/ec2-user/.env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Copy env file
        run: |
          echo "$ENV" > .env

        env:
          ENV: ${{ secrets.ENV }}

      - name: ⚙️ Set up commit SHA
        id: vars
        run: echo "GIT_COMMIT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # ==================== DOCKERHUB ====================

      - name: 🐳 Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 🐳 Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # ==================== ECR ====================
      
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 🏷️ Tag & Push to Amazon ECR
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest ${{ secrets.ECR_REPO_URI }}:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} ${{ secrets.ECR_REPO_URI }}:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.ECR_REPO_URI }}:latest
          docker push ${{ secrets.ECR_REPO_URI }}:${{ env.GIT_COMMIT }}

      # ==================== EC2 ====================
      - name: 🚀 Copy .env file to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          # sample code for bastion host
          # proxy_host: ${{ secrets.BASTION_HOST }}
          # proxy_username: ec2-user
          # proxy_key: ${{ secrets.BASTION_SSH_PRIVATE_KEY}}
          
          source: ".env"
          target: "/home/ec2-user/"
          
      - name: 🚀 Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          # sample code for bastion host
          # proxy_host: ${{ secrets.BASTION_HOST }}
          # proxy_username: ec2-user
          # proxy_key: ${{ secrets.BASTION_SSH_PRIVATE_KEY}}

          script: |
            chmod 600 /home/ec2-user/.env
            
            echo "🚀 Pull latest image from ECR"
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URI }}
            docker pull ${{ secrets.ECR_REPO_URI }}:latest

            echo "🚀 Stop & Remove existing container"
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            echo "🚀 Run new container"
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --env-file ${{ env.ENV_PATH }} \
              -p ${{ env.SPRING_SERVER_PORT }}:${{ env.SPRING_SERVER_PORT }} \
              ${{ secrets.ECR_REPO_URI }}:latest
