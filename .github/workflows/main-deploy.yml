name: "⚙️ CI/CD: EC2 deployment + monitoring setup"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: daypalette-spring
  CONTAINER_NAME: daypalette-spring-server
  SPRING_SERVER_PORT: 8090
  ENV_PATH: /home/ec2-user/.env

jobs:
  deployment-and-monitoring-setup:
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Copy env file
        run: |
          echo "$ENV" > .env

        env:
          ENV: ${{ secrets.ENV }}

      - name: ⚙️ Set up commit SHA
        run: |
          echo "GIT_COMMIT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # ==================== DOCKERHUB ====================

      - name: 🐳 Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 🐳 Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # ==================== ECR ====================
      
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: 🏷️ Tag & Push to Amazon ECR
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest ${{ secrets.ECR_REPO_URI }}:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} ${{ secrets.ECR_REPO_URI }}:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.ECR_REPO_URI }}:latest
          docker push ${{ secrets.ECR_REPO_URI }}:${{ env.GIT_COMMIT }}

      # ==================== EC2 ====================

      - name: 🚀 Deploy Spring Boot server to EC2 (via SSM)
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Create .env and deploy Spring Boot container" \
            --targets '[{"Key":"tag:Name","Values":["DayPalette_spb"]}]' \
            --parameters commands="[
                'if [ ! -f /home/ec2-user/.env ]; then',
                '  SECRET=$(aws secretsmanager get-secret-value --secret-id daypalette-env --region ap-northeast-2 --query SecretString --output text)',
                '  echo \"$SECRET\" > /home/ec2-user/.env',
                '  chmod 600 /home/ec2-user/.env',
                '  chown ec2-user:ec2-user /home/ec2-user/.env',
                'fi',
                'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URI }}',
                'docker stop ${{ env.CONTAINER_NAME }} || true',
                'docker rm ${{ env.CONTAINER_NAME }} || true',
                'docker pull ${{ secrets.ECR_REPO_URI }}:latest',
                'docker run -d --name ${{ env.CONTAINER_NAME }} --env-file /home/ec2-user/.env -p ${{ env.SPRING_SERVER_PORT }}:${{ env.SPRING_SERVER_PORT }} ${{ secrets.ECR_REPO_URI }}:latest'
            ]" \
            --region ${{ secrets.AWS_REGION }} \
            --output text

      - name: 🚀 Install Prometheus & Grafana (via SSM)
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Install Prometheus and Grafana via Docker Compose" \
            --targets '[{"Key":"tag:Name","Values":["DayPalette_spb"]}]' \
            |
            aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --comment "Install Prometheus and Grafana via Docker Compose" \
              --targets '[{"Key":"tag:Name","Values":["DayPalette_spb"]}]' \
              --parameters commands="[
                'curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)\" -o /usr/local/bin/docker-compose',
                'chmod +x /usr/local/bin/docker-compose',
                'echo \"global:\" > /home/ec2-user/prometheus.yml',
                'echo \"  scrape_interval: 15s\" >> /home/ec2-user/prometheus.yml',
                'echo \"scrape_configs:\" >> /home/ec2-user/prometheus.yml',
                'echo \"  - job_name: spring-boot\" >> /home/ec2-user/prometheus.yml',
                'echo \"    metrics_path: /actuator/prometheus\" >> /home/ec2-user/prometheus.yml',
                'echo \"    static_configs:\" >> /home/ec2-user/prometheus.yml',
                'echo \"      - targets: [\\\"localhost:8090\\\"]\" >> /home/ec2-user/prometheus.yml',
                'echo \"version: \\\"3\\\"\" > /home/ec2-user/docker-compose.yaml',
                'echo \"services:\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"  prometheus:\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"    image: prom/prometheus\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"    volumes:\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"      - /home/ec2-user/prometheus.yml:/etc/prometheus/prometheus.yml\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"    ports:\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"      - \\\"9090:9090\\\"\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"  grafana:\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"    image: grafana/grafana\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"    ports:\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"      - \\\"3000:3000\\\"\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"    environment:\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"      - GF_SECURITY_ADMIN_USER=admin\" >> /home/ec2-user/docker-compose.yaml',
                'echo \"      - GF_SECURITY_ADMIN_PASSWORD=admin\" >> /home/ec2-user/docker-compose.yaml',
                'cd /home/ec2-user && docker-compose up -d'
              ]" \
              --region ${{ secrets.AWS_REGION }} \
              --output text