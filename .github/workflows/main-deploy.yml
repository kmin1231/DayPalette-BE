name: "⚙️ CI/CD: EC2 deployment + monitoring setup"

on:
  push:
    branches:
      - main
      - feat/monitor
  workflow_dispatch:

env:
  IMAGE_NAME: daypalette-spring
  CONTAINER_NAME: daypalette-spring-server
  SPRING_SERVER_PORT: 8090
  ENV_PATH: /home/ec2-user/.env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout repository
        uses: actions/checkout@v3
        
      - name: ⚙️ Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: ⚙️ Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m pip install --upgrade pip
          pip install ansible>=8.4.0 boto3>=1.28.0 botocore>=1.31.0

      - name: ⚙️ Copy env file
        run: |
          echo "$ENV" > .env

        env:
          ENV: ${{ secrets.ENV }}

      - name: ⚙️ Set up commit SHA
        run: |
          echo "GIT_COMMIT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # ==================== DOCKERHUB ====================

      - name: 🐳 Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 🐳 Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # ==================== ECR ====================
      
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: 🏷️ Tag & Push to Amazon ECR
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest ${{ secrets.ECR_REPO_URI }}:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.GIT_COMMIT }} ${{ secrets.ECR_REPO_URI }}:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.ECR_REPO_URI }}:latest
          docker push ${{ secrets.ECR_REPO_URI }}:${{ env.GIT_COMMIT }}

      # ==================== EC2 ====================

      - name: 🚀 Deploy Spring Boot server to EC2 (via SSM)
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Create .env and deploy Spring Boot container" \
            --targets '[{"Key":"tag:Name","Values":["DayPalette_spb"]}]' \
            --parameters commands="[
              'SECRET=$(aws secretsmanager get-secret-value --secret-id daypalette-env --region ap-northeast-2 --query SecretString --output text)',
              'echo \"$SECRET\" > /home/ec2-user/.env',
              'chmod 600 /home/ec2-user/.env',
              'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URI }}',
              'docker stop ${{ env.CONTAINER_NAME }} || true',
              'docker rm ${{ env.CONTAINER_NAME }} || true',
              'docker pull ${{ secrets.ECR_REPO_URI }}:latest',
              'docker run -d --name ${{ env.CONTAINER_NAME }} --env-file ${{ env.ENV_PATH }} -p ${{ env.SPRING_SERVER_PORT }}:${{ env.SPRING_SERVER_PORT }} ${{ secrets.ECR_REPO_URI }}:latest'
            ]" \
            --region ${{ secrets.AWS_REGION }} \
            --output text

      - name: 🚀 Install amazon.aws collection
        run: ansible-galaxy collection install amazon.aws

      - name: 🚀 Debug Ansible inventory (test)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-inventory -i ansible/inventory_ssm.yaml --graph

      - name: 🚀 Install Prometheus & Grafana (Ansible via SSM)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i ansible/inventory_ssm.yaml ansible/setup-monitoring.yml